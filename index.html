<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Math World 3 - Final</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5c94fc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Super Math World">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Verdana&display=swap" rel="stylesheet"> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --mario-red: #E60012;
            --sky-blue: #5c94fc;
            --cave-black: #000000;
            --brick-brown: #b84e00;
            --coin-gold: #ffde00;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--sky-blue);
            transition: background-color 1s ease;
            text-align: center;
            padding: 10px;
            margin: 0;
            touch-action: manipulation;
            color: white;
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overscroll-behavior: none;
        }

        /* --- LOGIN OVERLAY --- */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--mario-red);
            z-index: 3000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-box {
            background: #fff; border: 4px solid black; padding: 20px; border-radius: 10px;
            width: 80%; max-width: 300px; box-shadow: 10px 10px 0 rgba(0,0,0,0.3);
        }
        .login-input {
            width: 90%; padding: 10px; margin: 10px 0; font-family: 'Verdana'; font-size: 1em;
            border: 2px solid #ccc; border-radius: 5px;
        }
        .login-btn {
            background: #4caf50; color: white; border: none; padding: 15px; width: 100%;
            font-family: 'Press Start 2P'; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 0 #2e7d32;
        }
        .login-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .guest-btn {
            background: #999; color: white; border: none; padding: 10px; width: 100%;
            font-family: 'Press Start 2P'; cursor: pointer; margin-top: 10px; font-size: 0.7em;
        }

        /* --- HUD --- */
        .hud {
            display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
            padding: 10px 5px; text-transform: uppercase;
            font-size: 0.65em; text-shadow: 2px 2px 0px black;
            gap: 5px; margin-top: 30px;
        }
        .hud-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .streak-title { color: #ff9800; }
        
        .on-fire {
            color: #ffde00;
            text-shadow: 0 0 5px red, 0 0 10px orange;
            animation: burn 0.5s infinite alternate;
        }
        @keyframes burn { from { opacity: 0.8; } to { opacity: 1; text-shadow: 0 0 15px red; } }

        /* --- SCORECARD --- */
        #scorecard-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); z-index: 2000;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .scorecard-box {
            background: #e45c10; border: 4px solid #fff; box-shadow: 8px 8px 0 #000;
            border-radius: 10px; padding: 20px; width: 85%; max-width: 400px; text-align: center;
        }
        .level-title { font-size: 1.5em; margin-bottom: 20px; text-shadow: 2px 2px 0 #000; }
        .stars-container { font-size: 3em; margin-bottom: 20px; height: 60px; }
        .star { display: inline-block; opacity: 0; transform: scale(0); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .star.pop { opacity: 1; transform: scale(1); }
        .stat-row { 
            display: flex; justify-content: space-between; margin: 15px 0; 
            font-family: 'Verdana', sans-serif; font-size: 1em; font-weight: bold; text-shadow: 1px 1px 0 #000;
        }
        .continue-btn {
            background: #4caf50; border: 2px solid #fff; color: white;
            padding: 15px 30px; font-family: 'Press Start 2P', cursive; margin-top: 20px;
            cursor: pointer; box-shadow: 0 6px 0 #2e7d32; font-size: 0.8em; border-radius: 5px;
        }
        .continue-btn:active { transform: translateY(6px); box-shadow: 0 0 0; }

        /* --- GAMEPLAY --- */
        .question-container {
            flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 60px;
        }
        .question-text {
            font-family: 'Verdana', sans-serif; font-weight: bold; font-size: 1.6em; letter-spacing: 0.5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); line-height: 1.4;
            margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 15px;
            border-radius: 15px; border: 2px solid rgba(255,255,255,0.3); width: 90%;
        }
        #loading-container { width: 80%; display: none; flex-direction: column; align-items: center; margin-top: 10px; }
        .progress-shell { width: 100%; height: 20px; background: #000; border: 2px solid white; border-radius: 10px; overflow: hidden; }
        .progress-fill { width: 100%; height: 100%; background: repeating-linear-gradient(45deg, #ffde00, #ffde00 10px, #ff9d00 10px, #ff9d00 20px); animation: barberpole 1s linear infinite; }
        @keyframes barberpole { from { background-position: 0 0; } to { background-position: 40px 0; } }
        #force-start-btn { display: none; margin-top: 20px; font-size: 0.6em; background: #333; color: white; border: 1px solid white; padding: 10px; cursor: pointer; }

        .quiz-image { max-height: 150px; max-width: 90%; border: 4px solid white; border-radius: 10px; margin-bottom: 20px; box-shadow: 5px 5px 0px rgba(0,0,0,0.5); background: white; display: none; }
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 95%; max-width: 500px; }
        .brick-btn {
            background: repeating-linear-gradient(45deg, #b84e00, #b84e00 10px, #983e00 10px, #983e00 20px);
            border: 4px solid black; color: white; padding: 15px 5px;
            font-family: 'Verdana', sans-serif; font-weight: bold; font-size: 1.2em;
            cursor: pointer; text-shadow: 2px 2px 0 black; box-shadow: 0 6px 0 #5a2400;
            border-radius: 5px; white-space: normal; min-height: 60px;
            display: flex; align-items: center; justify-content: center;
        }
        .brick-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #5a2400; }

        /* FIXED FEEDBACK STYLE: Smaller & Padded */
        #feedback { 
            font-family: 'Press Start 2P', cursive; 
            font-size: 0.7em; /* Made smaller */
            min-height: 30px; 
            margin-bottom: 25px; /* Added spacing */
            text-shadow: 2px 2px 0 black;
            display: flex; justify-content: center; align-items: center;
        }
        .correct { color: #5eff5e; } .wrong { color: #ff5e5e; }

        /* Shake Animation */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.3s; }

        /* --- MARIO & SCENERY --- */
        .ground { position: fixed; bottom: 0; left: 0; width: 100%; height: 40px; background-color: #b84e00; border-top: 4px solid #000; z-index: 5; }
        .grass { position: fixed; bottom: 40px; left: 0; width: 100%; height: 10px; background-color: #00aa00; border-top: 4px solid black; z-index: 5; }
        
        .hero-hit {
            position: fixed; bottom: 38px; left: 8px; z-index: 11;
            margin: 0; padding: 12px; border: 0; background: transparent;
            line-height: 0; cursor: pointer; appearance: none; -webkit-appearance: none;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }
        .hero-hit:focus { outline: none; }
        .hero-img {
            display: block; height: 70px; width: auto;
            image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none;
        }
        .hero-img[hidden] { display: none !important; }
        .hero-canvas { width: 70px; height: 70px; }
        .hero-canvas.is-gold { filter: drop-shadow(0 0 3px #ffe56a); }
        .hero-jump { animation: jump 0.62s linear; }
        @keyframes jump {
            0% { transform: translateY(0); animation-timing-function: cubic-bezier(0.15, 0.75, 0.3, 1); }
            48% { transform: translateY(-120px); animation-timing-function: cubic-bezier(0.45, 0.02, 0.8, 0.45); }
            100% { transform: translateY(0); }
        }

        /* Question-block burst. Pointer events stay off so the next answer is never blocked. */
        .qblock-fx {
            position: fixed; width: 48px; height: 48px; z-index: 12;
            pointer-events: none;
        }
        .qblock {
            position: absolute; inset: 0;
            background: #f8d020;
            border: 4px solid #000;
            box-shadow: inset 4px 4px 0 #fff3a0, inset -4px -4px 0 #d48900;
            display: flex; align-items: center; justify-content: center;
            animation: qblock-in 0.16s ease-out;
        }
        .qblock::before, .qblock::after {
            content: ''; position: absolute; width: 6px; height: 6px; background: #e8a010;
        }
        .qblock::before { top: 3px; left: 3px; box-shadow: 28px 0 0 #e8a010; }
        .qblock::after { bottom: 3px; left: 3px; background: #c47a08; box-shadow: 28px 0 0 #c47a08; }
        .qmark { position: relative; z-index: 1; display: block; filter: drop-shadow(2px 2px 0 #7a4510); }
        @keyframes qblock-in {
            0% { transform: translateY(10px) scale(0.7); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .qblock-fx.is-hit .qblock { animation: qblock-hit 0.28s ease-out forwards; }
        @keyframes qblock-hit {
            0% { transform: translateY(0) scale(1); opacity: 1; filter: brightness(1); }
            35% { transform: translateY(-12px) scale(1.05, 0.92); opacity: 1; filter: brightness(1.35); }
            100% { transform: translateY(-4px) scale(1.2); opacity: 0; }
        }
        .qfrag {
            position: absolute; left: 15px; top: 16px; width: 14px; height: 12px;
            background: #f8d020; border: 2px solid #000;
            box-shadow: inset -2px -2px 0 #d48900, inset 2px 2px 0 #fff3a0;
            opacity: 0;
        }
        .qblock-fx.is-hit .qfrag { animation: frag-burst 0.62s ease-in forwards; animation-delay: 0.1s; }
        @keyframes frag-burst {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            40% { transform: translate(calc(var(--dx) * 0.55), calc(var(--dy) * 0.2 - 14px)) rotate(calc(var(--rot) * 0.4)); opacity: 1; }
            100% { transform: translate(var(--dx), calc(var(--dy) + 26px)) rotate(var(--rot)); opacity: 0; }
        }
        .qcoin {
            position: absolute; left: 50%; top: 10px; width: 16px; height: 20px; margin-left: -8px;
            border-radius: 50%; border: 2px solid #000; opacity: 0;
            background: radial-gradient(circle at 35% 30%, #fff7b0, #ffd100 42%, #e09800);
        }
        .qcoin::after {
            content: ''; position: absolute; left: 4px; top: 3px; width: 4px; height: 6px;
            background: rgba(255,255,255,0.85); border-radius: 50%;
        }
        .qblock-fx.is-hit .qcoin { animation: coin-pop 0.58s ease-out forwards; animation-delay: 0.08s; }
        @keyframes coin-pop {
            0% { transform: translateY(6px) scale(0.3); opacity: 1; }
            30% { transform: translateY(-28px) scale(1.12, 1.12); opacity: 1; }
            50% { transform: translateY(-40px) scale(0.35, 1); opacity: 1; }
            70% { transform: translateY(-52px) scale(1, 1); opacity: 1; }
            100% { transform: translateY(-68px) scale(0.85); opacity: 0; }
        }
        
        .music-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); color: white; border: 2px solid white; padding: 5px 10px; font-size: 0.5em; cursor: pointer; z-index: 100; font-family: 'Press Start 2P', cursive; }

        .collection-btn {
            position: absolute; top: 10px; left: 10px; z-index: 100; margin: 0; width: auto; max-width: 46vw;
            min-height: 0; background: rgba(0,0,0,0.5); color: white; border: 2px solid white;
            box-shadow: none; padding: 5px 8px; font-size: 0.5em; line-height: 1.3; cursor: pointer;
            font-family: 'Press Start 2P', cursive; text-align: center;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .collection-btn span { display: inline; color: #ffde00; margin-left: 0; }
        .collection-btn:active { transform: translateY(2px); }
        .collection-menu-btn {
            background: #ffde00; color: #1a1a1a; white-space: normal; line-height: 1.45;
            font-size: 0.62em; box-shadow: 0 4px 0 #b8860b;
        }
        .collection-menu-btn:active { transform: translateY(4px); box-shadow: none; }

        .surprise-test-note {
            position: fixed; top: 4px; left: 50%; transform: translateX(-50%);
            z-index: 120; font-size: 8px; color: #ffe14a; text-shadow: 2px 2px 0 #000;
            pointer-events: none; white-space: nowrap;
        }
        .surprise-test-note[hidden] { display: none !important; }

        .daily-surprise {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; z-index: 20; margin: 2px 0 8px;
        }
        .daily-surprise[hidden] { display: none !important; }
        .mystery-hit {
            appearance: none; -webkit-appearance: none; background: transparent; border: 0;
            color: white; font-family: 'Press Start 2P', cursive; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 2px 8px; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .mystery-hit:focus { outline: none; }
        .mystery-wrap {
            position: relative; width: 48px; height: 48px;
            animation: mystery-glow 0.9s ease-in-out infinite alternate;
        }
        .mystery-block {
            box-sizing: border-box; width: 48px; height: 48px; position: relative;
            background: #f8d020; border: 4px solid #000;
            box-shadow: inset 4px 4px 0 #fff3a0, inset -4px -4px 0 #d48900;
            display: flex; align-items: center; justify-content: center;
            animation: mystery-bob 1.1s ease-in-out infinite;
        }
        .mystery-block::before, .mystery-block::after {
            content: ''; position: absolute; width: 6px; height: 6px; background: #e8a010;
        }
        .mystery-block::before { top: 3px; left: 3px; box-shadow: 28px 0 0 #e8a010; }
        .mystery-block::after { bottom: 3px; left: 3px; background: #c47a08; box-shadow: 28px 0 0 #c47a08; }
        .mystery-block .qmark { position: relative; z-index: 1; display: block; filter: drop-shadow(2px 2px 0 #7a4510); }
        .daily-label { font-size: 11px; color: #fff3a0; text-shadow: 2px 2px 0 #000; }
        .surprise-progress {
            font-family: Verdana, sans-serif; font-size: 13px; font-weight: 700;
            color: #fff; text-shadow: 2px 2px 0 #000; margin-top: 2px; line-height: 1.35;
            max-width: 320px;
        }
        .daily-surprise.is-locked .mystery-wrap { animation: none; filter: saturate(0.65) brightness(0.88); }
        .daily-surprise.is-locked .mystery-block { animation: none; }
        .daily-surprise.is-ready .mystery-wrap { animation: mystery-glow 0.55s ease-in-out infinite alternate; }
        .daily-surprise.is-ready .surprise-progress { color: #fff6b0; }
        .daily-surprise.is-locked.is-nudged .mystery-block { animation: surprise-nudge 0.28s linear; }
        @keyframes surprise-nudge {
            0% { transform: translateX(0); }
            30% { transform: translateX(-4px); }
            60% { transform: translateX(4px); }
            100% { transform: translateX(0); }
        }
        .mystery-frag {
            position: absolute; left: 16px; top: 16px; width: 12px; height: 10px;
            background: #f8d020; border: 2px solid #000; opacity: 0; pointer-events: none;
        }
        .daily-surprise.is-opening .mystery-wrap { animation: none; filter: none; }
        .daily-surprise.is-opening .mystery-block { animation: qblock-hit 0.42s ease-out forwards; }
        .daily-surprise.is-opening .mystery-frag { animation: frag-burst 0.55s ease-in forwards; }
        @keyframes mystery-bob {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }
        @keyframes mystery-glow {
            from { filter: drop-shadow(0 0 3px #ffe14a); }
            to { filter: drop-shadow(0 0 10px #fff6b0) drop-shadow(0 0 16px #ff9d00); }
        }

        .surprise-overlay, .collection-overlay {
            position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.78);
            display: flex; align-items: center; justify-content: center; padding: 12px;
        }
        .surprise-overlay { z-index: 4500; }
        .surprise-overlay[hidden], .collection-overlay[hidden] { display: none !important; }
        .surprise-card, .collection-box {
            width: min(440px, 100%); max-height: 92dvh; overflow: auto;
            background: #e45c10; border: 4px solid #fff; box-shadow: 8px 8px 0 #000;
            border-radius: 10px; padding: 16px 14px 18px; text-align: center;
            -webkit-overflow-scrolling: touch;
        }
        .collection-box { display: flex; flex-direction: column; }
        .surprise-kicker, .collection-title {
            font-size: 0.78em; line-height: 1.45; text-shadow: 2px 2px 0 #000; margin-bottom: 6px;
        }
        .collection-count { color: #ffde00; font-size: 0.72em; text-shadow: 2px 2px 0 #000; margin-bottom: 4px; }
        .collection-hint, .surprise-fact {
            font-family: Verdana, sans-serif; font-size: 15px; font-weight: 700; line-height: 1.45;
            margin: 8px 0 12px; text-shadow: 1px 1px 0 #000;
        }
        .surprise-name { color: #ffde00; font-size: 0.95em; line-height: 1.4; text-shadow: 2px 2px 0 #000; margin: 8px 0 4px; }
        .surprise-bonus { color: #fff6b0; font-size: 0.68em; text-shadow: 2px 2px 0 #000; margin-bottom: 8px; }
        #surpriseCanvas, .char-art canvas {
            image-rendering: pixelated; image-rendering: crisp-edges; display: block; margin: 0 auto;
        }
        .char-art canvas { width: 100%; height: auto; aspect-ratio: 1 / 1; max-width: 72px; }
        @keyframes surprise-pop {
            0% { transform: scale(0.2); opacity: 0; }
            62% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .surprise-card.pop { animation: surprise-pop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .collection-grid {
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
            width: 100%; overflow-y: auto; min-height: 0; margin-bottom: 8px;
        }
        .char-card {
            background: rgba(0,0,0,0.28); border: 3px solid #000; border-radius: 6px;
            padding: 4px 2px 6px; min-width: 0;
        }
        .char-card.unlocked { border-color: #ffde00; background: rgba(255,222,0,0.14); }
        .char-art { position: relative; }
        .char-q {
            position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-62%);
            font-size: 22px; color: #fff; text-shadow: 3px 3px 0 #000; pointer-events: none;
        }
        .char-name {
            font-family: Verdana, sans-serif; font-size: 11px; font-weight: 700; line-height: 1.2;
            margin-top: 2px; text-shadow: 1px 1px 0 #000; word-break: break-word;
        }
        .collection-tabs { display: flex; gap: 8px; margin: 2px 0 8px; }
        .collection-tab {
            flex: 1; appearance: none; -webkit-appearance: none;
            font-family: 'Press Start 2P', cursive; font-size: 0.58em; line-height: 1.4;
            padding: 10px 4px; border: 3px solid #000; border-radius: 6px;
            background: rgba(0,0,0,0.28); color: #fff; cursor: pointer;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .collection-tab.is-on { background: #ffde00; color: #1a1a1a; }
        .collection-tab.gold-tab.is-on { background: #ffe14a; color: #3a2800; }
        .collection-playing {
            font-family: Verdana, sans-serif; font-size: 14px; font-weight: 700;
            color: #b6ffb0; text-shadow: 1px 1px 0 #000; margin-bottom: 6px;
        }
        button.char-card {
            appearance: none; -webkit-appearance: none; color: #fff; font: inherit;
            text-align: center; cursor: pointer; width: 100%;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }
        button.char-card:focus { outline: 2px solid #fff; outline-offset: 1px; }
        button.char-card:active { transform: translateY(2px); }
        .char-card.locked { cursor: default; }
        .char-card.is-selected {
            border-color: #5eff5e; box-shadow: inset 0 0 0 2px #5eff5e;
            background: rgba(94, 255, 94, 0.28);
        }
        .char-card.gold-card.unlocked { border-color: #ffe98a; background: rgba(255, 210, 40, 0.22); }
        .char-play {
            font-family: Verdana, sans-serif; font-size: 11px; font-weight: 700;
            color: #fff3a0; margin-top: 2px; line-height: 1.2;
        }
        .char-card.is-selected .char-play { color: #b6ffb0; }
        .mario-mini {
            height: 64px; width: auto; max-width: 100%;
            display: block; margin: 0 auto; object-fit: contain;
        }
        .collection-btn.is-gold span { color: #ffe14a; }
        @media (max-height: 680px) {
            .question-container { justify-content: flex-start; margin-bottom: 78px; padding-top: 2px; }
            .daily-surprise { margin-bottom: 4px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .mystery-block, .mystery-wrap,
            .daily-surprise.is-ready .mystery-wrap,
            .daily-surprise.is-locked.is-nudged .mystery-block { animation: none; }
            .surprise-card.pop { animation: none; }
        }
    </style>
</head>
<body>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {

            storageBucket: "super-math-tracker.firebasestorage.app",
            messagingSenderId: "193983274782",

            measurementId: "G-RB7770405Z"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            var db = firebase.firestore();
            var auth = firebase.auth();
            
            auth.onAuthStateChanged((user) => {
                if (user) {
                    document.getElementById('login-status').innerText = "Syncing Profile...";
                    currentUserEmail = user.email;

                    loadCloudData().then(() => initApp());

            });

        } catch(e) { console.log("Firebase not configured yet"); }

        // --- DIRECT SHEET LOAD ---
        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREhCuPrIB_HZ6Pa1IKHHrusqwgQddjZNGhnjr4W2TRG-jAuBgtakUZZdIQTHEQbjYniUaEpvVh1fXI/pub?output=csv";

        // --- AUDIO ENGINE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(freq, type, duration, startTime = 0) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime + startTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + startTime + duration);
            osc.start(audioCtx.currentTime + startTime);
            osc.stop(audioCtx.currentTime + startTime + duration);
        }

        function playCoinSound() {
            playTone(987, 'square', 0.1, 0); 
            playTone(1318, 'square', 0.4, 0.08); 
        }

        function playOneUpSound() {
            const speed = 0.12;
            playTone(1318, 'square', speed, 0);         // E6
            playTone(1567, 'square', speed, speed);     // G6
            playTone(2637, 'square', speed, speed*2);   // E7
            playTone(2093, 'square', speed, speed*3);   // C7
            playTone(2349, 'square', speed, speed*4);   // D7
            playTone(3135, 'square', speed + 0.4, speed*5); // G7
        }

        function playBonkSound() { 
            playTone(150, 'sawtooth', 0.3, 0); 
        }

        // Block-break chime. Context is created on the first tap/click so iOS will allow it.
        // The MUSIC button only starts or stops the background track; coin, bonk, and 1-up
        // effects already play while that track is off, and this chime follows the same rule.
        let rewardAudioCtx = null;
        let jumpSerial = 0;
        let blockFx = null;
        const MARIO_JUMP_PX = 120;
        const BLOCK_SIZE = 48;

        function unlockRewardAudio() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                if (!rewardAudioCtx) rewardAudioCtx = new AC();
                if (rewardAudioCtx.state === 'suspended') rewardAudioCtx.resume();
                const buffer = rewardAudioCtx.createBuffer(1, 1, 22050);
                const silent = rewardAudioCtx.createBufferSource();
                silent.buffer = buffer;
                silent.connect(rewardAudioCtx.destination);
                silent.start(0);
            } catch (e) {}
            try {
                if (typeof audioCtx !== 'undefined' && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
            return rewardAudioCtx;
        }

        function playBlockChime() {
            try {
                const ctx = rewardAudioCtx;
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume();
                const now = ctx.currentTime + 0.01;

                const bump = ctx.createOscillator();
                const bumpGain = ctx.createGain();
                bump.type = 'sine';
                bump.frequency.setValueAtTime(196, now);
                bump.frequency.exponentialRampToValueAtTime(72, now + 0.09);
                bumpGain.gain.setValueAtTime(0.0001, now);
                bumpGain.gain.exponentialRampToValueAtTime(0.14, now + 0.012);
                bumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
                bump.connect(bumpGain);
                bumpGain.connect(ctx.destination);
                bump.start(now);
                bump.stop(now + 0.11);

                const dur = 0.14;
                const frames = Math.max(1, Math.floor(ctx.sampleRate * dur));
                const noiseBuf = ctx.createBuffer(1, frames, ctx.sampleRate);
                const data = noiseBuf.getChannelData(0);
                for (let i = 0; i < frames; i++) {
                    const env = 1 - i / frames;
                    data[i] = (Math.random() * 2 - 1) * env * env;
                }
                const noise = ctx.createBufferSource();
                noise.buffer = noiseBuf;
                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 1400;
                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(0.11, now + 0.07);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noise.start(now + 0.07);
                noise.stop(now + 0.24);

                [784, 1046.5, 1318.5].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    const t0 = now + 0.06 + i * 0.055;
                    osc.frequency.setValueAtTime(freq, t0);
                    gain.gain.setValueAtTime(0.0001, t0);
                    gain.gain.exponentialRampToValueAtTime(0.06, t0 + 0.018);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(t0);
                    osc.stop(t0 + 0.24);
                });
            } catch (e) {}
        }

        function startMarioJump(force) {
            const sprite = document.getElementById('heroSprite');
            const mario = (sprite && !sprite.hidden) ? sprite : document.getElementById('mario');
            if (!mario) return null;
            if (!force && mario.classList.contains('hero-jump')) return null;
            const serial = ++jumpSerial;
            mario.classList.remove('hero-jump');
            void mario.offsetWidth;
            const rect = mario.getBoundingClientRect();
            mario.classList.add('hero-jump');
            const clearJump = (e) => {
                if (e && e.animationName !== 'jump') return;
                if (serial !== jumpSerial) return;
                mario.classList.remove('hero-jump');
            };
            mario.addEventListener('animationend', clearJump, { once: true });
            setTimeout(clearJump, 900);
            return rect;
        }

        function clearBlockFx() {
            if (!blockFx) return;
            blockFx.timers.forEach(clearTimeout);
            if (blockFx.el && blockFx.el.parentNode) blockFx.el.remove();
            blockFx = null;
        }

        function spawnQuestionBlock(originRect) {
            clearBlockFx();
            const el = document.createElement('div');
            el.className = 'qblock-fx';
            el.setAttribute('aria-hidden', 'true');
            const left = originRect.left + (originRect.width - BLOCK_SIZE) / 2;
            const top = Math.max(8, originRect.top - MARIO_JUMP_PX - BLOCK_SIZE + 10);
            el.style.left = Math.round(left) + 'px';
            el.style.top = Math.round(top) + 'px';

            const block = document.createElement('div');
            block.className = 'qblock';
            block.innerHTML = '<svg class="qmark" viewBox="0 0 16 16" width="34" height="34" aria-hidden="true" shape-rendering="crispEdges"><rect x="3" y="2" width="6" height="1" fill="#fff6c8"/><rect x="2" y="3" width="2" height="1" fill="#fff6c8"/><rect x="8" y="3" width="2" height="1" fill="#fff6c8"/><rect x="2" y="4" width="1" height="1" fill="#fff6c8"/><rect x="9" y="4" width="1" height="2" fill="#fff6c8"/><rect x="8" y="6" width="1" height="1" fill="#fff6c8"/><rect x="7" y="7" width="1" height="1" fill="#fff6c8"/><rect x="6" y="8" width="2" height="1" fill="#fff6c8"/><rect x="6" y="9" width="1" height="1" fill="#fff6c8"/><rect x="6" y="11" width="1" height="2" fill="#fff6c8"/></svg>';
            el.appendChild(block);

            const coin = document.createElement('div');
            coin.className = 'qcoin';
            el.appendChild(coin);

            [[-34, -26, -150], [32, -34, 140], [-26, 18, -70], [28, 24, 110], [-4, -46, 50], [6, 34, -40]].forEach(([dx, dy, rot]) => {
                const frag = document.createElement('i');
                frag.className = 'qfrag';
                frag.style.setProperty('--dx', dx + 'px');
                frag.style.setProperty('--dy', dy + 'px');
                frag.style.setProperty('--rot', rot + 'deg');
                el.appendChild(frag);
            });

            document.body.appendChild(el);
            const timers = [
                setTimeout(() => {
                    if (!el.isConnected) return;
                    el.classList.add('is-hit');
                    playBlockChime();
                }, 290),
                setTimeout(() => {
                    if (el.parentNode) el.remove();
                    if (blockFx && blockFx.el === el) blockFx = null;
                }, 1300)
            ];
            blockFx = { el, timers };
        }

        function celebrateCorrect() {
            unlockRewardAudio();
            const rect = startMarioJump(true);
            if (rect) spawnQuestionBlock(rect);
        }

        // --- APP LOGIC ---
        let gameState = { streak: 0, lastLogin: null, coins: 0, world: 1, stage: 1, score: 0, questionsAnsweredLevel: 0, correctInLevel: 0, characters: [], dailySurpriseDate: null, goldCharacters: [], playAs: 'mario', dailyCorrectByDay: {} };
        let allQuestions = []; let recentQuestions = []; let currentQ = {}; let currentUserEmail = "guest";
        let appStarted = false;
        
        // Anti-Guessing Vars
        let isInputLocked = false; 
        let attemptsOnCurrentQuestion = 0;

        function appLogin() {
            try {
                const email = document.getElementById('email').value;
                const pass = document.getElementById('password').value;
                const btn = document.getElementById('loginBtn');
                
                btn.innerText = "CONNECTING...";
                document.getElementById('login-error').innerText = "";

                if(!firebase || !auth) { 
                    alert("Firebase Error: The database script did not load. Check internet connection."); 
                    btn.innerText = "LOGIN FAILED";
                    return; 
                }

                auth.signInWithEmailAndPassword(email, pass)
                    .then((userCredential) => {
                        btn.innerText = "SUCCESS!";
                        // onAuthStateChanged will handle the rest
                    })
                    .catch((error) => {
                        btn.innerText = "LOGIN & PLAY";
                        document.getElementById('login-error').innerText = error.message;
                        alert("Login Failed: " + error.message);
                    });
            } catch(e) {
                alert("Critical Error: " + e.message);
            }
        }

        function readSavedState() {
            try {
                if (!window.localStorage) return null;
                var raw = localStorage.getItem('marioMathState');
                if (!raw) return null;
                var saved = JSON.parse(raw);
                if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return null;
                return saved;
            } catch (e) {
                return null;
            }
        }

        function playAsGuest() {
            currentUserEmail = "guest";
            document.getElementById('login-overlay').style.display = 'none';
            const saved = readSavedState();
            if(saved) Object.assign(gameState, saved);
            initApp();
        }

        // --- CLOUD SAVE LOGIC ---
        function loadCloudData() {
            if(!db || currentUserEmail === 'guest') return Promise.resolve();
            
            return db.collection('users').doc(currentUserEmail).get().then((doc) => {
                var cloudData = null;
                if (doc.exists) {
                    console.log("Cloud save found!");
                    cloudData = doc.data();
                    Object.assign(gameState, cloudData);
                } else {
                    console.log("New user, creating cloud save...");
                }
                // Union browser + cloud friends before any save. A cloud profile from
                // before the collection, or an empty list, must not erase Luigi.
                try { restoreCollectedCharacters(cloudData); } catch (e) {}
                var cloudFriends = cloudData ? sanitizeCharacters(cloudData.characters).length : 0;
                var cloudGold = cloudData ? sanitizeCharacters(cloudData.goldCharacters).length : 0;
                var keptFriends = sanitizeCharacters(gameState.characters).length;
                var keptGold = sanitizeCharacters(gameState.goldCharacters).length;
                if (!doc.exists || keptFriends > cloudFriends || keptGold > cloudGold) saveGame();
            }).catch((error) => {
                console.error("Error loading cloud data:", error);
                const saved = readSavedState();
                if(saved) Object.assign(gameState, saved);
            });
        }

        function saveGame() {
            try { restoreCollectedCharacters(null); } catch (e) {}
            try { localStorage.setItem('marioMathState', JSON.stringify(gameState)); } catch (e) {}
            if(db && currentUserEmail !== 'guest') {
                db.collection('users').doc(currentUserEmail).set(gameState, { merge: true });
            }
            updateUI();
        }

        function logAttempt(isCorrect, questionData) {
            if(!db || currentUserEmail === "guest") return;
            db.collection("math_logs").add({
                user: currentUserEmail,
                timestamp: new Date(),
                question: questionData.Question,
                category: questionData.Category || "General",
                result: isCorrect ? "Correct" : "Wrong",
                world: gameState.world
            });
        }

        function initApp() {
            if(appStarted) return; 
            appStarted = true;

            if(typeof gameState.correctInLevel === 'undefined') gameState.correctInLevel = 0;
            try { prepareCollection(); } catch (e) {}
            checkStreak(); updateUI(); updateWorldTheme();
            try { refreshDailySurprise(); } catch (e) {}
            var collectionOpen = document.getElementById('collectionOverlay');
            if (collectionOpen && !collectionOpen.hidden) {
                try { renderCollection(); } catch (e) {}
            }

            console.log("Fetching questions...");
            document.getElementById('loading-container').style.display = 'flex';
            setTimeout(() => { document.getElementById('force-start-btn').style.display = 'block'; }, 7000);

            fetch(sheetURL)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.text();
                })
                .then(csvText => {
                    Papa.parse(csvText, {
                        header: true, skipEmptyLines: true,
                        complete: function(results) {
                            const cleanData = results.data.filter(r => r.Question && r.Answer);
                            if(cleanData.length > 0) {
                                allQuestions = cleanData;
                                document.getElementById('loading-container').style.display = 'none';
                                loadNextQuestion();
                            } else { 
                                console.log("Empty sheet data");
                                forceOfflineMode(); 
                            }
                        }
                    });
                })
                .catch(error => {
                    console.error("Fetch Error:", error);
                    forceOfflineMode();
                });
        }

        function forceOfflineMode() {
            document.getElementById('loading-container').style.display = 'none';
            allQuestions = [
                {Question: "10 + 10 = ?", Option1: "20", Option2: "30", Option3: "40", Answer: "20", Category: "Offline"},
                {Question: "5 + 5 = ?", Option1: "10", Option2: "15", Option3: "25", Answer: "10", Category: "Offline"},
                {Question: "Red Color?", Option1: "Blue", Option2: "Red", Option3: "Green", Answer: "Red", Category: "Offline"}
            ];
            loadNextQuestion();
            if(!window.offlineAlertShown) {
                alert("⚠️ Loaded Offline Mode (Check Internet)");
                window.offlineAlertShown = true;
            }
        }

        function loadNextQuestion() {
            isInputLocked = false;
            attemptsOnCurrentQuestion = 0;
            
            const btns = document.querySelectorAll('.brick-btn');
            btns.forEach(b => {
                b.style.opacity = "1";
                b.style.cursor = "pointer";
                b.disabled = false;
                b.style.background = ""; 
                b.style.border = "4px solid black";
                b.classList.remove('shake');
            });

            document.getElementById('feedback').innerText = "";
            let pool = allQuestions; 
            const qIndex = Math.floor(Math.random() * pool.length);
            currentQ = pool[qIndex];
            
            document.getElementById('qText').innerHTML = currentQ.Question;
            const imgEl = document.getElementById('qImage');
            if(currentQ.Image && currentQ.Image.trim().startsWith('http')) {
                imgEl.src = currentQ.Image.trim(); imgEl.style.display = 'block';
            } else { imgEl.style.display = 'none'; }

            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = ""; 
            const options = [currentQ.Option1, currentQ.Option2, currentQ.Option3].sort(() => Math.random() - 0.5);
            options.forEach(opt => {
                if(!opt) return; 
                const btn = document.createElement('button');
                btn.className = 'brick-btn';
                btn.innerText = opt;
                btn.onclick = function() { handleAnswer(opt, this); };
                answersDiv.appendChild(btn);
            });
        }

        function handleAnswer(selectedText, btnElement) {
            if(isInputLocked) return;

            const feedback = document.getElementById('feedback');
            const isCorrect = (selectedText.trim() === currentQ.Answer.trim());

            logAttempt(isCorrect, currentQ);

            if(isCorrect) {
                // SUCCESS LOGIC
                if(attemptsOnCurrentQuestion === 0) {
                    const oldCoins = gameState.coins;
                    gameState.coins += 1;

                        playOneUpSound();

                        confetti({ particleCount: 300, spread: 100 });
                    } else {
                        playCoinSound();
                        feedback.innerHTML = "CORRECT! (+1 Coin)";
                    }

                    playCoinSound();
                    feedback.innerHTML = "Correct! (No Coin)";
                    feedback.style.color = "#ccc";
                }

                gameState.score += 200; 
                feedback.className = "correct";
                try { celebrateCorrect(); } catch (e) {}
                
                gameState.questionsAnsweredLevel++; gameState.correctInLevel++;
                if(gameState.streak >= 5) document.getElementById('streakDisplay').classList.add('on-fire');
                try { recordDailyCorrect(); } catch (e) {}

                if(gameState.questionsAnsweredLevel >= 10) { showScorecard(); } 
                else { saveGame(); setTimeout(loadNextQuestion, 1500); }
            } else {

                playBonkSound();
                attemptsOnCurrentQuestion++;

        function localDateString(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function normalizeLastLogin(value) {
            if (typeof value !== 'string' || !value) return null;
            const iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
            if (iso) {
                const y = +iso[1], mo = +iso[2], day = +iso[3];
                const dt = new Date(y, mo - 1, day);
                if (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === day) return value;
                return null;
            }
            const months = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
            const oldFmt = /^(?:Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})\s+(\d{4})$/.exec(value);
            if (!oldFmt) return null;
            const y = +oldFmt[3], mo = months[oldFmt[1]], day = +oldFmt[2];
            const dt = new Date(y, mo, day);
            if (dt.getFullYear() !== y || dt.getMonth() !== mo || dt.getDate() !== day) return null;
            return localDateString(dt);
        }

            const lastLogin = normalizeLastLogin(gameState.lastLogin);
            if (lastLogin === yesterday) { gameState.streak++; gameState.lastLogin = today; saveGame(); }
            else if (lastLogin !== today) { gameState.streak = 1; gameState.lastLogin = today; saveGame(); }
            else if (gameState.lastLogin !== today) { gameState.lastLogin = today; saveGame(); }
            if(gameState.streak >= 5) document.getElementById('streakDisplay').classList.add('on-fire');
        }

        function canonicalCharacterId(value) {
            var id, i, character;
            if (typeof value !== 'string') return null;
            id = value.trim().toLowerCase();
            if (id.indexOf('gold:') === 0) id = id.slice(5).trim();
            else if (id.indexOf('gold ') === 0) id = id.slice(5).trim();
            for (i = 0; i < CHARACTERS.length; i++) {
                character = CHARACTERS[i];
                if (id === character.id || id === character.name.toLowerCase() || id === character.short.toLowerCase()) return character.id;
            }
            return null;
        }

        function extractCharacterIds(value, into, depth) {
            var i, key, id;
            if (!into) into = [];
            if (value == null || depth > 6) return into;
            if (typeof value === 'string') {
                id = canonicalCharacterId(value);
                if (id && into.indexOf(id) === -1) into.push(id);
                else if (!id && /[,|]/.test(value)) {
                    var parts = value.split(/[,|]/);
                    for (i = 0; i < parts.length; i++) extractCharacterIds(parts[i], into, depth + 1);
                }
                return into;
            }
            if (typeof value === 'number' || typeof value === 'boolean') return into;
            if (Array.isArray(value)) {
                for (i = 0; i < value.length; i++) extractCharacterIds(value[i], into, depth + 1);
                return into;
            }
            if (typeof value === 'object') {
                if (typeof value.id === 'string') extractCharacterIds(value.id, into, depth + 1);
                var keys = Object.keys(value);
                for (i = 0; i < keys.length; i++) {
                    key = keys[i];
                    id = canonicalCharacterId(key);
                    if (id && into.indexOf(id) === -1) into.push(id);
                    extractCharacterIds(value[key], into, depth + 1);
                }
            }
            return into;
        }

        function orderCharacterIds(ids) {
            var ordered = [];
            var i;
            for (i = 0; i < CHARACTERS.length; i++) {
                if (ids.indexOf(CHARACTERS[i].id) !== -1) ordered.push(CHARACTERS[i].id);
            }
            return ordered;
        }

        function sanitizeCharacters(list) {
            return orderCharacterIds(extractCharacterIds(list, [], 0));
        }

            try {
                if (!window.localStorage) return null;
                var raw = localStorage.getItem('marioMathCharacterBackup');
                if (!raw) return null;
                var saved = JSON.parse(raw);
                if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return null;
                return saved;
            } catch (e) {
                return null;
            }
        }

        function writeCharacterBackup(characters, goldCharacters) {
            try {
                if (!window.localStorage) return;
                if ((!characters || !characters.length) && (!goldCharacters || !goldCharacters.length)) return;
                localStorage.setItem('marioMathCharacterBackup', JSON.stringify({
                    characters: characters || [],
                    goldCharacters: goldCharacters || []
                }));
            } catch (e) {}
        }

        function collectIdsFromSave(state, gold) {
            var ids = [];
            var fields = gold
                ? ['goldCharacters', 'goldFound', 'collectedGold']
                : ['characters', 'foundCharacters', 'collectedCharacters', 'collection', 'dailyCharacters', 'surprises'];
            var i;
            if (!state || typeof state !== 'object') return ids;
            for (i = 0; i < fields.length; i++) extractCharacterIds(state[fields[i]], ids, 0);
            if (typeof state.playAs === 'string') {
                if (gold && state.playAs.indexOf('gold:') === 0) extractCharacterIds(state.playAs.slice(5), ids, 0);
                else if (!gold && state.playAs.indexOf('gold:') !== 0) extractCharacterIds(state.playAs, ids, 0);
            }
            return ids;
        }

        function saveHasClaimDate(state) {
            return !!(state && normalizeLastLogin(state.dailySurpriseDate));
        }

        function adoptSavedCharacters(sources) {
            var owned = [];
            var gold = [];
            var claimed = false;
            var i, j, ids;
            var list = [];
            for (i = 0; i < sources.length; i++) if (sources[i]) list.push(sources[i]);
            var backup = readCharacterBackup();
            if (backup) list.push(backup);
            for (i = 0; i < list.length; i++) {
                ids = collectIdsFromSave(list[i], false);
                for (j = 0; j < ids.length; j++) if (owned.indexOf(ids[j]) === -1) owned.push(ids[j]);
                ids = collectIdsFromSave(list[i], true);
                for (j = 0; j < ids.length; j++) if (gold.indexOf(ids[j]) === -1) gold.push(ids[j]);
                if (saveHasClaimDate(list[i])) claimed = true;
            }
            if (gold.length) {
                for (i = 0; i < CHARACTERS.length; i++) {
                    if (owned.indexOf(CHARACTERS[i].id) === -1) owned.push(CHARACTERS[i].id);
                }
            } else if (!owned.length && claimed && !sourcesHaveUnparsedFriends(list)) {
                owned.push('luigi');
            }
            return { characters: orderCharacterIds(owned), goldCharacters: orderCharacterIds(gold) };
        }

        function fieldHasContent(value) {
            if (value == null || value === '') return false;
            if (typeof value === 'string') return value.trim() !== '';
            if (Array.isArray(value)) return value.length > 0;
            if (typeof value === 'object') return Object.keys(value).length > 0;
            return false;
        }

        function sourcesHaveUnparsedFriends(sources) {
            var keys = ['characters', 'foundCharacters', 'collectedCharacters', 'collection', 'dailyCharacters', 'surprises', 'goldCharacters', 'goldFound', 'collectedGold'];
            var i, j, value;
            for (i = 0; i < sources.length; i++) {
                if (!sources[i]) continue;
                for (j = 0; j < keys.length; j++) {
                    value = sources[i][keys[j]];
                    if (fieldHasContent(value) && !extractCharacterIds(value, [], 0).length) return true;
                }
            }
            return false;
        }

        function firstUnparsedFriends(sources, gold) {
            var keys = gold ? ['goldCharacters', 'goldFound', 'collectedGold'] : ['characters', 'foundCharacters', 'collectedCharacters', 'collection', 'dailyCharacters', 'surprises'];
            var i, j, value;
            for (i = 0; i < sources.length; i++) {
                if (!sources[i]) continue;
                for (j = 0; j < keys.length; j++) {
                    value = sources[i][keys[j]];
                    if (fieldHasContent(value) && !extractCharacterIds(value, [], 0).length) return value;
                }
            }
            return null;
        }

        function restoreCollectedCharacters(extra) {
            var sources = [readSavedState(), extra, gameState];
            var adopted = adoptSavedCharacters(sources);
            var raw;
            if (adopted.characters.length) gameState.characters = adopted.characters;
            else {
                raw = firstUnparsedFriends(sources, false);
                if (raw) gameState.characters = raw;
                else gameState.characters = [];
            }
            if (adopted.goldCharacters.length) gameState.goldCharacters = adopted.goldCharacters;
            else {
                raw = firstUnparsedFriends(sources, true);
                if (raw) gameState.goldCharacters = raw;
                else gameState.goldCharacters = [];
            }
            gameState.playAs = sanitizePlayAs(gameState.playAs, sanitizeCharacters(gameState.characters), sanitizeCharacters(gameState.goldCharacters));
            // Keep the newest claim day from the browser or the cloud. A profile
            // that never stored that day must not erase it, or today's prize can be claimed twice.
            var recoveredDate = null;
            var s, d;
            for (s = 0; s < sources.length; s++) {
                if (!sources[s]) continue;
                d = normalizeLastLogin(sources[s].dailySurpriseDate);
                if (d && (!recoveredDate || d > recoveredDate)) recoveredDate = d;
            }
            if (recoveredDate) gameState.dailySurpriseDate = recoveredDate;
            writeCharacterBackup(sanitizeCharacters(gameState.characters), sanitizeCharacters(gameState.goldCharacters));
        }

        function characterById(id) {
            var i;
            for (i = 0; i < CHARACTERS.length; i++) {
                if (CHARACTERS[i].id === id) return CHARACTERS[i];
            }
            return null;
        }

        function sanitizePlayAs(value, owned, goldOwned) {
            var id;
            if (value === 'mario' || value == null || value === '') return 'mario';
            if (typeof value !== 'string') return 'mario';
            if (value.indexOf('gold:') === 0) {
                id = value.slice(5);
                if (characterById(id) && goldOwned.indexOf(id) !== -1) return 'gold:' + id;
                return 'mario';
            }
            if (characterById(value) && owned.indexOf(value) !== -1) return value;
            return 'mario';
        }

        function playAsName(playAs) {
            var character;
            if (!playAs || playAs === 'mario') return 'Mario';
            if (playAs.indexOf('gold:') === 0) {
                character = characterById(playAs.slice(5));
                return character ? ('Gold ' + character.name) : 'Mario';
            }
            character = characterById(playAs);
            return character ? character.name : 'Mario';
        }

        function currentOwned(state) {
            return sanitizeCharacters(state && state.characters);
        }

        function currentGold(state) {
            return sanitizeCharacters(state && state.goldCharacters);
        }

        function currentPlayAs(state) {
            return sanitizePlayAs(state && state.playAs, currentOwned(state), currentGold(state));
        }

        function sanitizeDailyCounts(bag) {
            var clean = {};
            var keys, i, value;
            if (!bag || typeof bag !== 'object' || Array.isArray(bag)) return clean;
            keys = Object.keys(bag);
            for (i = 0; i < keys.length; i++) {
                if (!normalizeLastLogin(keys[i])) continue;
                value = bag[keys[i]];
                if (typeof value !== 'number' || !isFinite(value) || value < 0) continue;
                clean[keys[i]] = Math.floor(value);
            }
            return clean;
        }

        function prepareCollection() {
            try { restoreCollectedCharacters(null); } catch (e) {}
            gameState.dailySurpriseDate = normalizeLastLogin(gameState.dailySurpriseDate);
