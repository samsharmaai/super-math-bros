        function applyHero() {
            var img = document.getElementById('mario');
            var canvas = document.getElementById('heroSprite');
            var btn = document.getElementById('marioJumpBtn');
            var play = currentPlayAs(gameState);
            var gold = false;
            var id = play;
            var character = null;
            if (img) img.classList.remove('hero-jump');
            if (canvas) {
                canvas.classList.remove('hero-jump');
                canvas.classList.remove('is-gold');
            }
            if (play.indexOf('gold:') === 0) {
                gold = true;
                id = play.slice(5);
            }
            if (play !== 'mario') character = characterById(id);
            if (!character) {
                if (canvas) canvas.hidden = true;
                if (img) { img.hidden = false; img.alt = 'Mario'; }
                if (btn) btn.setAttribute('aria-label', 'Make Mario jump');
                return;
            }
            if (!canvas) return;
            if (img) img.hidden = true;
            canvas.hidden = false;
            if (gold) canvas.classList.add('is-gold');
            try { paintSprite(canvas, character, false, gold); } catch (e) {}
            if (btn) btn.setAttribute('aria-label', 'Make ' + playAsName(play) + ' jump');
        }

        function surpriseDayOverride() {
            try {
                var search = window.location && window.location.search ? window.location.search : '';
                var match = /(?:\?|&)surpriseDay=([0-9]{4}-[0-9]{2}-[0-9]{2})/.exec(search);
                if (!match) return null;
                return normalizeLastLogin(match[1]);
            } catch (e) {
                return null;
            }
        }

        function surpriseToday() {
            var override = surpriseDayOverride();
            if (override) return override;
            var now = new Date();
            return localDateString(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
        }

        function dateClaimed(state) {
            var today = surpriseToday();
            if (!today || !state) return false;
            return normalizeLastLogin(state.dailySurpriseDate) === today;
        }

        function toGoldColor(hex) {
            var r, g, b, lum, mix, targetR, targetG, targetB;
            function clamp(n) { n = Math.round(n); if (n < 0) return 0; if (n > 255) return 255; return n; }
            function h(n) { var s = clamp(n).toString(16); return s.length === 1 ? '0' + s : s; }
            if (typeof hex !== 'string' || hex.charAt(0) !== '#') return '#e6b422';
            if (hex.length === 4) {
                r = parseInt(hex.charAt(1) + hex.charAt(1), 16);
                g = parseInt(hex.charAt(2) + hex.charAt(2), 16);
                b = parseInt(hex.charAt(3) + hex.charAt(3), 16);
            } else if (hex.length === 7) {
                r = parseInt(hex.slice(1, 3), 16);
                g = parseInt(hex.slice(3, 5), 16);
                b = parseInt(hex.slice(5, 7), 16);
            } else {
                return '#e6b422';
            }
            if (isNaN(r) || isNaN(g) || isNaN(b)) return '#e6b422';
            lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            targetR = 90 + lum * 165;
            targetG = 48 + lum * 176;
            targetB = 6 + lum * 64;
            mix = 0.86;
            return '#' + h(r * (1 - mix) + targetR * mix) + h(g * (1 - mix) + targetG * mix) + h(b * (1 - mix) + targetB * mix);
        }

        function paintSprite(canvas, sprite, locked, gold) {
            if (!canvas || !sprite || !sprite.pixels || !sprite.pixels.length) return;
            var ctx = canvas.getContext('2d');
            if (!ctx) return;
            var css = parseInt(canvas.getAttribute('data-size') || '80', 10);
            if (!css || css < 16) css = 80;
            var dpr = Math.min(window.devicePixelRatio || 1, 3);
            var px = Math.max(16, Math.round(css * dpr));
            if (canvas.width !== px || canvas.height !== px) {
                canvas.width = px;
                canvas.height = px;
            }
            if (canvas.getAttribute('data-fit') === 'cell') {
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
            } else {
                canvas.style.width = css + 'px';
                canvas.style.height = css + 'px';
            }
            var rows = sprite.pixels;
            var h = rows.length;
            var w = rows[0].length || 1;
            var scale = Math.floor(Math.min(canvas.width / w, canvas.height / h));
            if (scale < 1) scale = 1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = false;
            var ox = Math.floor((canvas.width - w * scale) / 2);
            var oy = Math.floor((canvas.height - h * scale) / 2);
            for (var y = 0; y < h; y++) {
                var row = rows[y];
                for (var x = 0; x < row.length; x++) {
                    var ch = row.charAt(x);
                    if (ch === '.' || ch === ' ') continue;
                    if (locked && gold) ctx.fillStyle = ch === 'K' ? '#140e04' : '#6a5420';
                    else if (locked) ctx.fillStyle = ch === 'K' ? '#070b14' : '#243356';
                    else if (gold) ctx.fillStyle = toGoldColor((sprite.colors && sprite.colors[ch]) || '#141414');
                    else ctx.fillStyle = (sprite.colors && sprite.colors[ch]) || '#141414';
                    ctx.fillRect(ox + x * scale, oy + y * scale, scale, scale);
                }
            }
        }

        function collectionButtonText(ownedCount, goldCount) {
            var total = CHARACTERS.length;
            if (ownedCount < total) return ownedCount + '/' + total;
            return 'G' + goldCount + '/' + total;
        }

        function updateCollectionButton() {
            var ownedCount = currentOwned(gameState).length;
            var goldCount = currentGold(gameState).length;
            var total = CHARACTERS.length;
            var countEl = document.getElementById('collectionBtnCount');
            var btn = document.getElementById('collectionBtn');
            var label;
            if (countEl) countEl.textContent = collectionButtonText(ownedCount, goldCount);
            if (!btn) return;
            if (ownedCount >= total) btn.classList.add('is-gold');
            else btn.classList.remove('is-gold');
            if (ownedCount < total) label = 'Character collection, ' + ownedCount + ' of ' + total + ' found';
            else label = 'Character collection, ' + goldCount + ' of ' + total + ' gold found';
            btn.setAttribute('aria-label', label);
        }

        function collectionHintText(ownedCount, goldCount, claimed, ready) {
            var total = CHARACTERS.length;
            var allNormal = ownedCount >= total;
            var allGold = goldCount >= total;
            if (allNormal && allGold && claimed) return 'All collected! Come back tomorrow for bonus coins.';
            if (allNormal && allGold) return 'All collected! Get 10 correct to unlock bonus coins.';
            if (allNormal && claimed) return 'Come back tomorrow for a shiny gold friend!';
            if (allNormal && ready) return 'Today\'s gold surprise is ready! Tap the glowing block.';
            if (allNormal) return 'Get 10 correct answers to unlock a shiny gold friend!';
            if (claimed) return 'Come back tomorrow for a new friend!';
            if (ready) return 'Today\'s surprise is ready! Tap the glowing block.';
            return 'Get 10 correct answers to unlock today\'s surprise!';
        }

        function appendCharacterCard(grid, opts) {
            var card, art, nameEl, playEl, img, q;
            if (opts.unlocked) {
                card = document.createElement('button');
                card.type = 'button';
                card.onclick = function () { selectPlayAs(opts.playAs); };
                card.setAttribute('aria-pressed', opts.selected ? 'true' : 'false');
                card.setAttribute('aria-label', opts.selected ? (opts.label + ', playing now') : ('Play as ' + opts.label));
            } else {
                card = document.createElement('div');
                card.setAttribute('aria-label', 'Locked character');
            }
            card.className = 'char-card ' + (opts.unlocked ? 'unlocked' : 'locked') + (opts.gold ? ' gold-card' : '') + (opts.selected ? ' is-selected' : '');
            art = document.createElement('div');
            art.className = 'char-art';
            if (opts.mario) {
                img = document.createElement('img');
                img.src = 'mario.png';
                img.alt = '';
                img.className = 'mario-mini';
                img.draggable = false;
                art.appendChild(img);
            } else {
                art.appendChild(makeArtCanvas(opts.sprite, !opts.unlocked, opts.gold));
                if (!opts.unlocked) {
                    q = document.createElement('span');
                    q.className = 'char-q';
                    q.textContent = '?';
                    art.appendChild(q);
                }
            }
            nameEl = document.createElement('div');
            nameEl.className = 'char-name';
            nameEl.textContent = opts.unlocked ? opts.shortName : '?';
            card.appendChild(art);
            card.appendChild(nameEl);
            if (opts.unlocked) {
                playEl = document.createElement('div');
                playEl.className = 'char-play';
                playEl.textContent = opts.selected ? 'Playing' : 'Play as';
                card.appendChild(playEl);
            }
            grid.appendChild(card);
        }

        function makeArtCanvas(sprite, locked, gold) {
            var canvas = document.createElement('canvas');
            canvas.width = 72;
            canvas.height = 72;
            canvas.setAttribute('data-size', '72');
            canvas.setAttribute('data-fit', 'cell');
            canvas.setAttribute('aria-hidden', 'true');
            try { paintSprite(canvas, sprite, locked, gold); } catch (e) {}
            return canvas;
        }

        function setCollectionPage(page) {
            collectionPage = page === 'gold' ? 'gold' : 'normal';
            try { renderCollection(); } catch (e) {}
        }

        function selectPlayAs(playAs) {
            var saved, choice;
            if (!appStarted) {
                if (!readSavedState() && window.localStorage && localStorage.getItem('marioMathState')) return;
                saved = readSavedState() || {};
                var adoptedLogin = adoptSavedCharacters([saved]);
                if (adoptedLogin.characters.length) saved.characters = adoptedLogin.characters;
                if (adoptedLogin.goldCharacters.length) saved.goldCharacters = adoptedLogin.goldCharacters;
                choice = sanitizePlayAs(playAs, saved.characters, saved.goldCharacters);
                saved.playAs = choice;
                try { localStorage.setItem('marioMathState', JSON.stringify(saved)); } catch (e) {}
                try { writeCharacterBackup(saved.characters, saved.goldCharacters); } catch (e) {}
                try { renderCollection(); } catch (e) {}
                return;
            }
            choice = sanitizePlayAs(playAs, currentOwned(gameState), currentGold(gameState));
            gameState.playAs = choice;
            try { saveGame(); } catch (e) {}
            try { applyHero(); } catch (e) {}
            try { renderCollection(); } catch (e) {}
        }

        function renderCollection() {
            var source = appStarted ? gameState : (readSavedState() || gameState);
            var adoptedView = adoptSavedCharacters([source]);
            var owned = adoptedView.characters;
            var goldOwned = adoptedView.goldCharacters;
            var play = sanitizePlayAs(source && source.playAs, owned, goldOwned);
            var ownedMap = {};
            var goldMap = {};
            var i;
            var total = CHARACTERS.length;
            var onGold = collectionPage === 'gold';
            var countEl = document.getElementById('collectionCountLabel');
            var hintEl = document.getElementById('collectionHint');
            var playingEl = document.getElementById('collectionPlaying');
            var grid = document.getElementById('collectionGrid');
            var tabNormal = document.getElementById('collectionTabNormal');
            var tabGold = document.getElementById('collectionTabGold');
            var claimed = dateClaimed(source);
            var ready = surpriseIsReady(source);
            for (i = 0; i < owned.length; i++) ownedMap[owned[i]] = true;
            for (i = 0; i < goldOwned.length; i++) goldMap[goldOwned[i]] = true;
            if (tabNormal) {
                tabNormal.classList.toggle('is-on', !onGold);
                tabNormal.setAttribute('aria-selected', onGold ? 'false' : 'true');
            }
            if (tabGold) {
                tabGold.classList.toggle('is-on', onGold);
                tabGold.setAttribute('aria-selected', onGold ? 'true' : 'false');
            }
            if (countEl) {
                countEl.textContent = onGold
                    ? (goldOwned.length + ' / ' + total + ' gold found')
                    : (owned.length + ' / ' + total + ' found');
            }
            if (playingEl) playingEl.textContent = 'Playing as ' + playAsName(play);
            if (hintEl) {
                if (onGold && owned.length < total) hintEl.textContent = 'Find all 8 friends first. Then one shiny gold friend appears each day!';
                else hintEl.textContent = collectionHintText(owned.length, goldOwned.length, claimed, ready);
            }
            if (!grid) return;
            grid.textContent = '';
            if (!onGold) {
                appendCharacterCard(grid, {
                    mario: true, unlocked: true, selected: play === 'mario', gold: false,
                    playAs: 'mario', label: 'Mario', shortName: 'Mario'
                });
                for (i = 0; i < CHARACTERS.length; i++) {
                    appendCharacterCard(grid, {
                        sprite: CHARACTERS[i],
                        unlocked: !!ownedMap[CHARACTERS[i].id],
                        selected: play === CHARACTERS[i].id,
                        gold: false,
                        playAs: CHARACTERS[i].id,
                        label: CHARACTERS[i].name,
                        shortName: CHARACTERS[i].short
                    });
                }
                return;
            }
            for (i = 0; i < CHARACTERS.length; i++) {
                appendCharacterCard(grid, {
                    sprite: CHARACTERS[i],
                    unlocked: !!goldMap[CHARACTERS[i].id],
                    selected: play === ('gold:' + CHARACTERS[i].id),
                    gold: true,
                    playAs: 'gold:' + CHARACTERS[i].id,
                    label: 'Gold ' + CHARACTERS[i].name,
                    shortName: '\u2605 ' + CHARACTERS[i].short
                });
            }
        }

        function openCollection() {
            try {
                renderCollection();
                var el = document.getElementById('collectionOverlay');
                if (el) el.hidden = false;
                var btn = document.getElementById('collectionClose');
                if (btn && btn.focus) btn.focus();
            } catch (e) {}
        }

        function closeCollection() {
            var el = document.getElementById('collectionOverlay');
            if (el) el.hidden = true;
        }

        function closeSurprise() {
            var el = document.getElementById('surpriseOverlay');
            if (el) el.hidden = true;
            try { refreshDailySurprise(); } catch (e) {}
        }

        function applySurpriseTestNote() {
            var el = document.getElementById('surpriseTestNote');
            if (!el) return;
            var override = surpriseDayOverride();
            if (override) {
                el.hidden = false;
                el.textContent = 'TEST ' + override;
            } else {
                el.hidden = true;
            }
        }

        function dailyCorrectCountFor(state) {
            var today = surpriseToday();
            var bag, n;
            if (!state || !today) return 0;
            bag = sanitizeDailyCounts(state.dailyCorrectByDay);
            n = bag[today];
            if (typeof n !== 'number' || !isFinite(n) || n < 0) return 0;
            return Math.floor(n);
        }

        function surpriseIsReady(state) {
            return !dateClaimed(state) && dailyCorrectCountFor(state) >= DAILY_GOAL;
        }

        function inGoldHunt() {
            return currentOwned(gameState).length >= CHARACTERS.length && currentGold(gameState).length < CHARACTERS.length;
        }

        function surpriseProgressText(count) {
            var n = count;
            var what = inGoldHunt() ? 'today\'s gold surprise' : 'today\'s surprise';
            if (n < 0) n = 0;
            if (n > DAILY_GOAL) n = DAILY_GOAL;
            if (n >= DAILY_GOAL) return n + ' / ' + DAILY_GOAL + ' \u2014 tap to open ' + what + '!';
            return n + ' / ' + DAILY_GOAL + ' to unlock ' + what;
        }

        function refreshSurpriseProgress() {
            var el = document.getElementById('dailySurprise');
            var progress = document.getElementById('surpriseProgress');
            var label = document.querySelector('#dailySurprise .daily-label');
            var hit = document.getElementById('mysteryHit');
            var count, ready, claimed, goldPhase;
            if (!el) return;
            claimed = dateClaimed(gameState);
            count = dailyCorrectCountFor(gameState);
            ready = !claimed && count >= DAILY_GOAL;
            goldPhase = inGoldHunt();
            el.classList.toggle('is-ready', ready);
            el.classList.toggle('is-locked', !ready && !claimed);
            if (progress) progress.textContent = surpriseProgressText(count);
            if (label) label.textContent = goldPhase ? 'Gold Surprise!' : 'Daily Surprise!';
            if (hit) {
                if (ready) hit.setAttribute('aria-label', goldPhase ? 'Gold Surprise. Tap to open it.' : 'Daily Surprise. Tap to open it.');
                else hit.setAttribute('aria-label', surpriseProgressText(count));
            }
        }

        function refreshDailySurprise() {
            applySurpriseTestNote();
            var el = document.getElementById('dailySurprise');
            if (!el) return;
            if (dateClaimed(gameState)) {
                if (!el.classList.contains('is-opening')) el.hidden = true;
                return;
            }
            el.hidden = false;
            refreshSurpriseProgress();
        }

        function recordDailyCorrect() {
            var today, bag, n;
            if (dateClaimed(gameState)) return;
            today = surpriseToday();
            if (!today) return;
            bag = sanitizeDailyCounts(gameState.dailyCorrectByDay);
            n = bag[today];
            if (typeof n !== 'number' || !isFinite(n) || n < 0) n = 0;
            bag[today] = Math.floor(n) + 1;
            gameState.dailyCorrectByDay = bag;
            try { refreshSurpriseProgress(); } catch (e) {}
        }

        function pokeMysteryBlock() {
            var el;
            try { unlockRewardAudio(); } catch (e) {}
            el = document.getElementById('dailySurprise');
            if (!el || el.hidden || el.classList.contains('is-opening')) return;
            if (dateClaimed(gameState)) return;
            if (dailyCorrectCountFor(gameState) >= DAILY_GOAL) {
                try { grantDailySurprise(); } catch (e) {}
                return;
            }
            el.classList.remove('is-nudged');
            void el.offsetWidth;
            el.classList.add('is-nudged');
            try { refreshSurpriseProgress(); } catch (e) {}
        }

        function playSurpriseSound() {
            try {
                unlockRewardAudio();
                var ctx = rewardAudioCtx;
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume();
                var now = ctx.currentTime + 0.58;
                var notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
                for (var i = 0; i < notes.length; i++) {
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.type = 'square';
                    var t0 = now + i * 0.07;
                    osc.frequency.setValueAtTime(notes[i], t0);
                    gain.gain.setValueAtTime(0.0001, t0);
                    gain.gain.exponentialRampToValueAtTime(0.06, t0 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(t0);
                    osc.stop(t0 + 0.2);
                }
            } catch (e) {}
        }

        function showSurpriseCard(character, bonus, gold) {
            var overlay = document.getElementById('surpriseOverlay');
            var canvas = document.getElementById('surpriseCanvas');
            var nameEl = document.getElementById('surpriseName');
            var factEl = document.getElementById('surpriseFact');
            var bonusEl = document.getElementById('surpriseBonus');
            var card = document.getElementById('surpriseCard');
            var kicker = document.querySelector('#surpriseCard .surprise-kicker');
            if (!overlay) return;
            if (kicker) kicker.textContent = (character && gold) ? 'GOLD SURPRISE!' : 'DAILY SURPRISE!';
            try {
                if (character) {
                    paintSprite(canvas, character, false, !!gold);
                    if (nameEl) nameEl.textContent = gold ? ('Gold ' + character.name) : character.name;
                    if (factEl) factEl.textContent = character.fact;
                } else {
                    paintSprite(canvas, COIN_ART, false);
                    if (nameEl) nameEl.textContent = 'All collected!';
                    if (factEl) factEl.textContent = 'You found every friend! Here are some bonus coins. See you tomorrow!';
                }
            } catch (e) {}
            if (bonusEl) bonusEl.textContent = '+' + bonus + ' bonus coins!';
            overlay.hidden = false;
            if (card) {
                card.classList.remove('pop');
                void card.offsetWidth;
                card.classList.add('pop');
            }
            var closeBtn = document.getElementById('surpriseClose');
            if (closeBtn && closeBtn.focus) closeBtn.focus();
            try {
                if (typeof confetti === 'function') {
                    var burst = { particleCount: character ? 80 : 40, spread: 70, origin: { y: 0.55 } };
                    if (gold) burst.colors = ['#ffde00', '#fff6b0', '#e6a800', '#ffffff'];
                    confetti(burst);
                }
            } catch (e) {}
        }

        function openDailyBlock(character, bonus, gold) {
            var el = document.getElementById('dailySurprise');
            if (el) el.classList.add('is-opening');
            if (dailyOpenTimer) clearTimeout(dailyOpenTimer);
            dailyOpenTimer = setTimeout(function () {
                dailyOpenTimer = null;
                if (el) {
                    el.classList.remove('is-opening');
                    el.hidden = true;
                }
                try { showSurpriseCard(character, bonus, gold); } catch (e) {}
            }, 620);
        }

        function nextMissingCharacter(list) {
            var i;
            for (i = 0; i < CHARACTERS.length; i++) {
                if (list.indexOf(CHARACTERS[i].id) === -1) return CHARACTERS[i];
            }
            return null;
        }

        function grantDailySurprise() {
            var today, next, gold, bonus, beforeBonus;
            if (dailyClaimLock || dateClaimed(gameState)) return;
            if (dailyCorrectCountFor(gameState) < DAILY_GOAL) return;
            today = surpriseToday();
            if (!today) return;
            dailyClaimLock = true;
            try { unlockRewardAudio(); } catch (e) {}
            try { playSurpriseSound(); } catch (e) {}
            gameState.characters = sanitizeCharacters(gameState.characters);
            gameState.goldCharacters = sanitizeCharacters(gameState.goldCharacters);
            next = nextMissingCharacter(gameState.characters);
            gold = false;
            if (!next) {
                next = nextMissingCharacter(gameState.goldCharacters);
                gold = !!next;
            }
            bonus = next ? 5 : (4 + Math.floor(Math.random() * 7));
            if (next && !gold) gameState.characters.push(next.id);
            if (next && gold) gameState.goldCharacters.push(next.id);
            gameState.dailySurpriseDate = today;
            if (typeof gameState.coins === 'number' && isFinite(gameState.coins)) {
                beforeBonus = gameState.coins;
                gameState.coins += bonus;
                if (Math.floor(gameState.coins / 100) > Math.floor(beforeBonus / 100)) {
                    try { playOneUpSound(); } catch (e) {}
                }
            }
            try { saveGame(); } catch (e) {}
            openDailyBlock(next, bonus, gold);
        }

        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState !== 'visible' || !appStarted) return;
            try {
                if (!dateClaimed(gameState)) {
                    dailyClaimLock = false;
                    refreshDailySurprise();
                }
            } catch (e) {}
        });

        document.addEventListener('keydown', function (e) {
            if (!e || e.key !== 'Escape') return;
            closeSurprise();
            closeCollection();
        });

        try {
            var peek = readSavedState();
            if (peek) {
                var peekCount = document.getElementById('collectionBtnCount');
                var peekAdopt = adoptSavedCharacters([peek]);
                var peekOwned = peekAdopt.characters.length;
                var peekGold = peekAdopt.goldCharacters.length;
                var peekBtn = document.getElementById('collectionBtn');
                if (peekCount) peekCount.textContent = collectionButtonText(peekOwned, peekGold);
                if (peekBtn && peekOwned >= CHARACTERS.length) peekBtn.classList.add('is-gold');
                writeCharacterBackup(peekAdopt.characters, peekAdopt.goldCharacters);
            }
            applySurpriseTestNote();
        } catch (e) {}

        const marioJumpBtn = document.getElementById('marioJumpBtn');
        if (marioJumpBtn) {
            marioJumpBtn.addEventListener('pointerdown', function () {
                try { unlockRewardAudio(); } catch (e) {}
                startMarioJump(false);
            });
        }
    </script>
</body>
