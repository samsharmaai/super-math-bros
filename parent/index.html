<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Math Stats — Parent Dashboard</title>
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f4f6f9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #f4f6f9;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --ink: #0f172a;
            --ink-2: #334155;
            --muted: #64748b;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --accent: #4f46e5;
            --accent-soft: #eef2ff;
            --accent-ink: #3730a3;
            --good: #059669;
            --good-soft: #ecfdf5;
            --warn: #d97706;
            --warn-soft: #fffbeb;
            --bad: #dc2626;
            --bad-soft: #fef2f2;
            --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(15, 23, 42, 0.04);
            --radius: 16px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.45; }
        body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 24px); }
        button, input, select { font-family: inherit; }
        .num { font-variant-numeric: tabular-nums; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(244, 246, 249, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .topbar-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .brand { min-width: 0; }
        .brand h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand-sub {
            margin: 2px 0 0;
            font-size: 0.74rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .icon-btn {
            appearance: none;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink-2);
            border-radius: 11px;
            min-height: 38px;
            min-width: 38px;
            padding: 0 11px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }
        .icon-btn:hover { background: var(--surface-soft); border-color: var(--border-strong); }
        .icon-btn:active { transform: scale(0.97); }
        .icon-btn[hidden] { display: none !important; }

        .shell { max-width: 960px; margin: 0 auto; padding: 14px 14px 40px; }

        .alert-bar {
            background: var(--bad-soft);
            color: var(--bad);
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.84rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .alert-bar[hidden] { display: none !important; }

        .login-wrap {
            max-width: 380px;
            margin: 36px auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 26px 22px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .login-wrap h2 { margin: 0 0 6px; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
        .login-wrap p { margin: 0 0 16px; font-size: 0.86rem; color: var(--muted); }
        .login-form { display: flex; flex-direction: column; gap: 10px; text-align: left; }
        .field-lbl { font-size: 0.76rem; font-weight: 700; color: var(--ink-2); margin-bottom: -4px; }
        .text-input {
            width: 100%;
            min-height: 44px;
            padding: 10px 13px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.94rem;
            color: var(--ink);
            background: var(--surface-soft);
            outline: none;
            transition: border-color 0.15s, background 0.15s;
        }
        .text-input:focus { border-color: var(--accent); background: var(--surface); }
        .primary-btn {
            min-height: 46px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
            transition: background 0.15s, transform 0.1s;
        }
        .primary-btn:hover { background: #4338ca; }
        .primary-btn:active { transform: scale(0.98); }

        #dashboard-section { display: none; }

        .mode-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: #e6ebf2;
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 10px;
        }
        .mode-pill {
            appearance: none;
            border: none;
            background: transparent;
            color: var(--ink-2);
            border-radius: 11px;
            min-height: 42px;
            padding: 6px 8px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
            transition: background 0.16s, color 0.16s, box-shadow 0.16s;
        }
        .mode-pill.active {
            background: var(--surface);
            color: var(--accent);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
        }
        .pill-count {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 800;
            background: rgba(15, 23, 42, 0.08);
            color: var(--ink-2);
        }
        .mode-pill.active .pill-count { background: var(--accent-soft); color: var(--accent-ink); }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .range-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .chip-btn {
            appearance: none;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink-2);
            border-radius: 999px;
            min-height: 34px;
            padding: 4px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.14s;
        }
        .chip-btn.active { background: var(--ink); color: #ffffff; border-color: var(--ink); }
        .fresh-stamp { font-size: 0.74rem; color: var(--muted); }

        .tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }
        .tab-btn {
            appearance: none;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            border-radius: 12px;
            min-height: 42px;
            padding: 6px 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--accent-soft);
            color: var(--accent-ink);
            border-color: #c7d2fe;
        }

        .view-container { display: none; }
        .view-container.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }
        .card-title {
            margin: 0;
            font-size: 0.94rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--ink);
        }
        .card-meta { font-size: 0.75rem; font-weight: 600; color: var(--muted); }

        .readiness-grid {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .ring-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            flex-shrink: 0;
        }
        .ring-svg { width: 96px; height: 96px; transform: rotate(-90deg); }
        .ring-track { fill: none; stroke: #e2e8f0; stroke-width: 9; }
        .ring-fill { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
        .ring-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .ring-pct { font-size: 1.32rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
        .ring-lbl { font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 2px; }

        .readiness-info { flex: 1; min-width: 0; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .tone-good { background: var(--good-soft); color: var(--good); }
        .tone-warn { background: var(--warn-soft); color: var(--warn); }
        .tone-bad { background: var(--bad-soft); color: var(--bad); }
        .tone-muted { background: #f1f5f9; color: var(--muted); }
        .readiness-copy { margin: 0 0 10px; font-size: 0.84rem; color: var(--ink-2); }
        .mini-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .mini-stat {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 7px 8px;
        }
        .mini-stat span { display: block; font-size: 0.66rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
        .mini-stat b { display: block; font-size: 0.96rem; font-weight: 800; color: var(--ink); margin-top: 2px; }

        .compare-strip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .compare-box {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.15s;
        }
        .compare-box:hover { border-color: var(--accent); }
        .compare-box-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
        .compare-name { font-size: 0.76rem; font-weight: 800; color: var(--ink-2); }
        .compare-pct { font-size: 1.05rem; font-weight: 800; }
        .compare-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

        .strand-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 9px;
        }
        .strand-card {
            appearance: none;
            width: 100%;
            text-align: left;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 12px 13px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .strand-card:hover { border-color: #a5b4fc; background: #ffffff; }
        .strand-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
        .strand-name { font-size: 0.88rem; font-weight: 800; color: var(--ink); }
        .strand-pct { font-size: 0.96rem; font-weight: 800; }
        .bar-track { width: 100%; height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 999px; transition: width 0.45s ease; }
        .strand-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.74rem;
            color: var(--muted);
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }
        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px 14px;
            box-shadow: var(--shadow);
        }
        .kpi-lbl { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
        .kpi-val { font-size: 1.32rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .kpi-sub { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }

        .band-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            margin-top: 10px;
        }
        .band-box {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 8px 6px;
            text-align: center;
        }
        .band-box span { display: block; font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
        .band-box b { display: block; font-size: 1.05rem; font-weight: 800; margin: 2px 0; }
        .band-box small { display: block; font-size: 0.7rem; color: var(--ink-2); font-weight: 600; }
        .txt-good { color: var(--good); }
        .txt-warn { color: var(--warn); }
        .txt-bad { color: var(--bad); }
        .txt-muted { color: var(--muted); }

        .focus-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
        .focus-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 11px;
            border-radius: 11px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .focus-item:hover { border-color: #cbd5e1; }
        .focus-left { min-width: 0; }
        .focus-name { font-size: 0.85rem; font-weight: 800; color: var(--ink); }
        .focus-note { font-size: 0.74rem; color: var(--muted); }

        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        .toolbar-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            min-width: 150px;
            min-height: 40px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--surface);
            color: var(--ink);
            font-size: 0.86rem;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent); }
        .select-input {
            min-height: 40px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--surface);
            color: var(--ink);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }
        .filter-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 11px;
            background: var(--accent-soft);
            color: var(--accent-ink);
            font-size: 0.8rem;
            font-weight: 700;
        }
        .filter-banner[hidden] { display: none !important; }
        .clear-chip {
            border: none;
            background: #ffffff;
            color: var(--accent-ink);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.74rem;
            font-weight: 800;
            cursor: pointer;
        }

        .list-stack { display: flex; flex-direction: column; gap: 9px; }
        .topic-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px 14px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: border-color 0.15s, transform 0.1s;
        }
        .topic-row:hover { border-color: #a5b4fc; }
        .topic-row:active { transform: scale(0.99); }
        .topic-row.is-empty { opacity: 0.78; cursor: default; }
        .topic-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
        .topic-title-wrap { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
        .topic-name { font-size: 0.92rem; font-weight: 800; color: var(--ink); }
        .topic-score { font-size: 1.04rem; font-weight: 800; flex-shrink: 0; }
        .topic-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 7px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }
        .tag-test { background: #e0e7ff; color: #312e81; }
        .tag-classic { background: #f1f5f9; color: #475569; }
        .tag-mixed { background: #fef3c7; color: #92400e; }
        .tag-strand { background: #f8fafc; color: #475569; border: 1px solid var(--border); }
        .tag-hint { background: #fef3c7; color: #92400e; }
        .tag-step1 { background: #fef2f2; color: #b91c1c; }
        .tag-step2 { background: #eff6ff; color: #1d4ed8; }
        .tag-step3 { background: #f3e8ff; color: #6d28d9; }
        .tag-mastered { background: #ecfdf5; color: #047857; }
        .climb-strip { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        .climb-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
        .climb-bar { display: flex; width: 100%; height: 9px; border-radius: 999px; overflow: hidden; background: #e2e8f0; }
        .climb-seg-m { background: #059669; height: 100%; }
        .climb-seg-c { background: #f59e0b; height: 100%; }
        .climb-legend { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 0.72rem; color: var(--muted); font-weight: 700; }

        .q-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px 14px;
            box-shadow: var(--shadow);
        }
        .q-text { font-size: 0.9rem; font-weight: 700; color: var(--ink); line-height: 1.4; margin-bottom: 8px; }
        .q-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .q-metrics {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 8px;
            border-top: 1px solid #f1f5f9;
            font-size: 0.76rem;
            color: var(--ink-2);
        }

        .session-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px 14px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .session-row:hover { border-color: #a5b4fc; }
        .session-left { min-width: 0; flex: 1; }
        .session-date { font-size: 0.9rem; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
        .session-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.76rem; color: var(--muted); }
        .session-right { text-align: right; flex-shrink: 0; }
        .session-acc { font-size: 1.1rem; font-weight: 800; line-height: 1.1; }
        .session-sub { font-size: 0.7rem; font-weight: 700; color: var(--muted); margin-top: 2px; }

        .empty-state {
            background: var(--surface);
            border: 1px dashed var(--border-strong);
            border-radius: 16px;
            padding: 28px 18px;
            text-align: center;
            color: var(--muted);
        }
        .empty-state h3 { margin: 0 0 6px; font-size: 0.96rem; color: var(--ink); }
        .empty-state p { margin: 0; font-size: 0.84rem; }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.52);

        function groupQuestionInstances(logsDesc) {

                return isSheetTopic(c.name) && c.questions >= 2;
            }).sort(function (a, b) {
                return a.pct - b.pct || b.wrongAttempts - a.wrongAttempts;
            });

            var needs = ranked.filter(function (c) { return c.pct < 75; });
            var untouched = [];
            if (activeMode === 'test') {
                var seenSet = {};
                derived.categories.forEach(function (c) { seenSet[c.name] = true; });
                Object.keys(TEST_META.topicBank).forEach(function (cat) {
                    if (!seenSet[cat]) untouched.push(cat);
                });
            }

            if (!derived.categories.length) {
                weakLine.textContent = activeMode === 'test'
                    ? 'Once he finishes a Test Mode round, weak topics and blind spots will surface here automatically.'
                    : 'No answers in this view yet.';
                metaEl.textContent = '';
            } else if (needs.length) {
                weakLine.textContent = 'Prioritise these topics with a rough sheet before the next round:';
                metaEl.textContent = needs.length + ' below 75%';
            } else if (untouched.length) {
                weakLine.textContent = 'All practiced topics are at 75%+. Untried Test Mode topics remaining: ' + untouched.slice(0, 5).join(', ') + (untouched.length > 5 ? '…' : '') + '.';
                metaEl.textContent = untouched.length + ' untried';
            } else if (ranked.length) {
                weakLine.textContent = 'Every topic is above 75%. Lightest score is ' + ranked[0].name + ' at ' + ranked[0].pct + '%.';
                metaEl.textContent = 'All strong';
            } else {
                weakLine.textContent = 'A few more answers will pinpoint which topics need extra practice.';
                metaEl.textContent = '';
            }

            var focusItems = needs.length ? needs.slice(0, 3) : ranked.slice(0, 2);
            focusList.innerHTML = focusItems.map(function (c) {
                return '<li class="focus-item" onclick="drillTopic(\'' + esc(c.name).replace(/'/g, '\\\'') + '\')">' +
                    '<div class="focus-left">' +
                        '<div class="focus-name">' + esc(c.name) + '</div>' +
                        '<div class="focus-note num">' + c.firstCorrect + '/' + c.questions + ' first-try · ' + c.wrongAttempts + ' wrong' + (c.hints ? ' · ' + c.hints + ' hint' + (c.hints === 1 ? '' : 's') : '') + '</div>' +
                    '</div>' +
                    '<span class="status-badge tone-' + toneForPct(c.pct) + ' num">' + c.pct + '%</span>' +
                '</li>';
            }).join('');

            var bands = { Hard: [], Medium: [], Easy: [], New: [] };
            derived.questions.forEach(function (q) {
                if (!bands[q.calibre]) bands[q.calibre] = [];
                bands[q.calibre].push(q);
            });
            bandRow.innerHTML = ['Hard', 'Medium', 'Easy', 'New'].map(function (name) {
                var list = bands[name] || [];
                var fc = 0, tot = 0;
                list.forEach(function (q) { fc += q.firstCorrect; tot += q.seen; });
                var bp = tot ? Math.round((fc / tot) * 100) + '%' : '—';
                var tone = name === 'Hard' ? 'bad' : (name === 'Medium' ? 'warn' : (name === 'Easy' ? 'good' : 'muted'));
                return '<div class="band-box"><span>' + name + '</span><b class="num txt-' + tone + '">' + list.length + '</b><small class="num">' + bp + '</small></div>';
            }).join('');
        }

        function renderTopicsView() {
            var strandRow = document.getElementById('strand-filter-row');
            strandRow.style.display = activeMode === 'classic' ? 'none' : 'flex';
            var sortBy = document.getElementById('topic-sort').value;

            var rows = derived.categories.slice();
            if (activeMode === 'test') {
                var present = {};
                rows.forEach(function (r) { present[r.name] = true; });
                Object.keys(TEST_META.topicBank).forEach(function (cat) {
                    if (!present[cat]) {
                        rows.push({
                            name: cat,
                            strand: TEST_META.topicBank[cat].s,
                            questions: 0,
                            firstCorrect: 0,
                            attempts: 0,
                            wrongAttempts: 0,
                            hints: 0,
                            uniqueCount: 0,
                            bankCount: TEST_META.topicBank[cat].count,
                            testCount: 0,
                            classicCount: 0,
                            pct: null,
                            calibre: 'Untried'
                        });
                    }
                });
            }

            if (activeMode !== 'classic' && activeStrand !== 'all') {
                rows = rows.filter(function (r) { return r.strand === activeStrand; });
            }

            rows.sort(function (a, b) {
                if (sortBy === 'name') return a.name.localeCompare(b.name);
                if (sortBy === 'volume') return b.questions - a.questions || (a.pct == null ? 1 : -1);
                if (a.pct == null && b.pct == null) return a.name.localeCompare(b.name);
                if (a.pct == null) return 1;
                if (b.pct == null) return -1;
                return a.pct - b.pct || b.questions - a.questions;
            });

            var container = document.getElementById('topics-list');
            if (!rows.length) {
                container.innerHTML = '<div class="empty-state"><h3>No Topics Yet</h3><p>Answers in this mode will appear grouped by topic here.</p></div>';
                return;
            }

            container.innerHTML = rows.map(function (r) {
                var empty = r.questions === 0;
                var strandLabel = r.strand && STRAND_INFO[r.strand] ? STRAND_INFO[r.strand].label : '';
                var bankText = (activeMode === 'test' && r.bankCount) ? (r.uniqueCount + '/' + r.bankCount + ' bank') : '';
                var modeTags = '';
                if (activeMode === 'test' && !empty && derived.hillClimb && derived.hillClimb.byCat[r.name]) {
                    var hcs = derived.hillClimb.byCat[r.name];
                    var isMast = hcs.tier >= 3 && r.pct >= 80;
                    modeTags += isMast
                        ? '<span class="tag tag-mastered">★ Mastered</span>'
                        : '<span class="tag tag-step' + hcs.tier + '">Step ' + hcs.tier + '</span>';
                }
                if (activeMode === 'all') {
                    if (r.testCount) modeTags += '<span class="tag tag-test num">Test ' + r.testCount + '</span>';
                    if (r.classicCount) modeTags += '<span class="tag tag-classic num">Classic ' + r.classicCount + '</span>';
                }
                return '<div class="topic-row' + (empty ? ' is-empty' : '') + '"' + (empty ? '' : ' onclick="drillTopic(\'' + esc(r.name).replace(/'/g, '\\\'') + '\')"') + '>' +
                    '<div class="topic-head">' +
                        '<div class="topic-title-wrap">' +
                            '<span class="topic-name">' + esc(r.name) + '</span>' +
                            (strandLabel && activeMode !== 'classic' ? '<span class="tag tag-strand">' + esc(strandLabel) + '</span>' : '') +
                            modeTags +
                        '</div>' +
                        '<span class="topic-score num txt-' + toneForPct(r.pct) + '">' + (empty ? '—' : r.pct + '%') + '</span>' +
                    '</div>' +
                    '<div class="bar-track"><div class="bar-fill" style="width:' + (empty ? 0 : r.pct) + '%; background:' + colorForPct(r.pct) + ';"></div></div>' +
                    '<div class="topic-meta">' +
                        '<span class="num">' + (empty ? 'Not tried yet' : (r.firstCorrect + '/' + r.questions + ' first-try · ' + r.wrongAttempts + ' wrong' + (r.hints ? ' · ' + r.hints + ' hint' + (r.hints === 1 ? '' : 's') : ''))) + '</span>' +
                        '<span class="num">' + (bankText ? bankText : esc(r.calibre)) + '</span>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderQuestionsView() {
            var qSearch = (document.getElementById('q-search').value || '').trim().toLowerCase();
            var qSort = document.getElementById('q-sort').value;
            var banner = document.getElementById('q-topic-banner');
            if (activeTopicFilter) {
                banner.hidden = false;
                document.getElementById('q-topic-label').textContent = 'Topic: ' + activeTopicFilter;
            } else {
                banner.hidden = true;
            }

            var list = derived.questions.filter(function (q) {
                if (activeTopicFilter && q.category !== activeTopicFilter) return false;
                if (activeQFilter === 'missed' && q.wrong === 0) return false;
                if (activeQFilter === 'hint' && q.hints === 0) return false;
                if (qSearch && q.question.toLowerCase().indexOf(qSearch) === -1 && q.category.toLowerCase().indexOf(qSearch) === -1) return false;
                return true;
            });

            list.sort(function (a, b) {
                if (qSort === 'acc') return a.pct - b.pct || b.wrong - a.wrong;
                if (qSort === 'total') return b.seen - a.seen;
                if (qSort === 'recent') return b.lastTs - a.lastTs;
                return b.wrong - a.wrong || a.pct - b.pct;
            });

            var container = document.getElementById('questions-list');
            if (!list.length) {
                container.innerHTML = '<div class="empty-state"><h3>No Matching Questions</h3><p>Try clearing a filter or switching modes above.</p></div>';
                return;
            }

            container.innerHTML = list.slice(0, 120).map(function (q) {
                var strandLabel = q.strand && STRAND_INFO[q.strand] ? STRAND_INFO[q.strand].label : '';
                return '<div class="q-row">' +
                    '<div class="q-text">' + esc(q.question) + '</div>' +
                    '<div class="q-tags">' +
                        '<span class="tag ' + (q.mode === 'test' ? 'tag-test' : 'tag-classic') + '">' + (q.mode === 'test' ? 'Test Mode' : 'Classic') + '</span>' +
                        '<span class="tag tag-strand">' + esc(q.category) + '</span>' +
                        (strandLabel ? '<span class="tag tag-strand">' + esc(strandLabel) + '</span>' : '') +
                        (q.hints ? '<span class="tag tag-hint num">💡 ' + q.hints + ' hint' + (q.hints > 1 ? 's' : '') + '</span>' : '') +
                    '</div>' +
                    '<div class="q-metrics">' +
                        '<span class="num">First-try: <b>' + q.firstCorrect + '/' + q.seen + '</b> · Wrong: <b class="' + (q.wrong ? 'txt-bad' : '') + '">' + q.wrong + '</b></span>' +
                        '<span class="num txt-' + toneForPct(q.pct) + '" style="font-weight:800;">' + q.pct + '%</span>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderSessionsView() {
            var container = document.getElementById('sessions-list');
            if (!derived.sessions.length) {
                container.innerHTML = '<div class="empty-state"><h3>No Sessions Yet</h3><p>Completed play sessions will appear here grouped automatically.</p></div>';
                return;
            }
            container.innerHTML = derived.sessions.map(function (s, idx) {
                var modeTag = s.mode === 'test' ? '<span class="tag tag-test">📝 Test Mode</span>'
                    : (s.mode === 'mixed' ? '<span class="tag tag-mixed">Mixed</span>' : '<span class="tag tag-classic">🎮 Classic</span>');
                return '<div class="session-row" onclick="viewSessionDetails(' + idx + ')">' +
                    '<div class="session-left">' +
                        '<div class="session-date">' + esc(formatRelDate(s.startTime)) + '</div>' +
                        '<div class="session-meta">' + modeTag + '<span class="num">' + s.questions + ' Qs · ' + s.durationMin + ' min' + (s.hints ? ' · 💡 ' + s.hints : '') + '</span></div>' +
                    '</div>' +
                    '<div class="session-right">' +
                        '<div class="session-acc num txt-' + toneForPct(s.firstPct) + '">' + (s.firstPct == null ? '—' : s.firstPct + '%') + '</div>' +
                        '<div class="session-sub num">' + s.firstCorrect + '/' + s.questions + ' 1st try ›</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function viewSessionDetails(idx) {
            var s = derived.sessions[idx];
            if (!s) return;
            document.getElementById('modal-title').textContent = formatRelDate(s.startTime);
            document.getElementById('modal-sub').textContent = s.firstCorrect + '/' + s.questions + ' first-try (' + (s.firstPct == null ? '—' : s.firstPct + '%') + ') · ' + s.durationMin + ' min';
            var body = document.getElementById('session-detail-body');
            body.innerHTML = s.items.map(function (it, i) {
                var tries = it.attempts.length;
                var badge = it.firstTryCorrect
                    ? '<span class="status-badge tone-good" style="margin:0;">✓ First Try</span>'
                    : (it.resolved
                        ? '<span class="status-badge tone-warn" style="margin:0;">↺ Retry (' + tries + ')</span>'
                        : '<span class="status-badge tone-bad" style="margin:0;">✗ Missed</span>');
                return '<div class="tl-item">' +
                    '<div class="tl-top"><span class="num" style="font-size:0.74rem; font-weight:800; color:var(--muted);">Q' + (i + 1) + ' · ' + it.firstTs.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</span>' + badge + '</div>' +
                    '<div class="tl-q">' + esc(it.question) + '</div>' +
                    '<div class="tl-meta">' +
                        '<span class="tag ' + (it.mode === 'test' ? 'tag-test' : 'tag-classic') + '">' + (it.mode === 'test' ? 'Test' : 'Classic') + '</span>' +
                        '<span class="tag tag-strand">' + esc(it.category) + '</span>' +
                        (it.hintUsed ? '<span class="tag tag-hint">💡 Hint Opened</span>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
            document.getElementById('session-detail-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('session-detail-modal').classList.remove('open');
        }

        function setModeFilter(mode) {
            activeMode = mode;
            activeTopicFilter = '';
            if (mode === 'classic') activeStrand = 'all';
            recompute();
        }

        function setRangeFilter(range) {
            activeRange = range;
            document.querySelectorAll('.range-chips .chip-btn').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-range') === range);
            });
            recompute();
        }

        function setStrandFilter(strand) {
            activeStrand = strand;
            document.querySelectorAll('#strand-filter-row .chip-btn').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-strand') === strand);
            });
            renderTopicsView();
        }

        function openStrandTopics(strand) {
            if (activeMode === 'classic') activeMode = 'test';
            activeStrand = strand;
            document.querySelectorAll('#strand-filter-row .chip-btn').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-strand') === strand);
            });
            recompute();
            switchTab('topics');
        }

        function drillTopic(topicName) {
            activeTopicFilter = topicName;
            switchTab('questions');
            renderQuestionsView();
        }

        function clearTopicFilter() {
            activeTopicFilter = '';
            renderQuestionsView();
        }

        function setQFilter(f) {
            activeQFilter = f;
            document.querySelectorAll('#view-questions [data-qfilter]').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-qfilter') === f);
            });
            renderQuestionsView();
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-tab') === tabName);
            });
            document.querySelectorAll('.view-container').forEach(function (el) {
                el.classList.toggle('active', el.id === 'view-' + tabName);
            });
        }

        async function fetchLogs() {
            try {
                return await db.collection('math_logs').orderBy('timestamp', 'desc').get();
            } catch (err) {
                var code = err && err.code ? String(err.code) : '';
                var msg = err && err.message ? String(err.message) : '';
                if (code === 'failed-precondition' || msg.indexOf('index') !== -1) {
                    return await db.collection('math_logs').get();
                }
                throw err;
            }
        }

        async function generateReport() {
            var errorEl = document.getElementById('report-error');
            errorEl.hidden = true;
            errorEl.textContent = '';
            if (!auth || !auth.currentUser) {
                errorEl.textContent = 'Sign in before the answer log can be read.';
                errorEl.hidden = false;
                return;
            }
            var email = String(auth.currentUser.email || '').trim().toLowerCase();
            document.getElementById('dash-status').textContent = (auth.currentUser.email || 'Signed in') + ' · Loading…';
            var snapshot;
            try {
                snapshot = await fetchLogs();
            } catch (err) {
                errorEl.textContent = 'Could not read the answer log: ' + (err && err.message ? err.message : 'unknown error');
                errorEl.hidden = false;
                return;
            }
            allLogs = snapshot.docs.map(function (doc) {
                return classifyLog(doc.data() || {});
            }).filter(function (row) {
                return row.user === email && row.timestamp;
            });
            allLogs.sort(function (a, b) { return b.timestamp - a.timestamp; });

            document.getElementById('dash-status').textContent = (auth.currentUser.email || '') + ' · ' + DASH_BUILD;
            recompute();
        }

        function loginAndFetch() {
            var email = document.getElementById('email').value;
            var pass = document.getElementById('password').value;
            document.getElementById('error-msg').textContent = '';
            auth.signInWithEmailAndPassword(email, pass).catch(function (error) {
                document.getElementById('error-msg').textContent = error.message;
            });
        }

        function logout() {
            auth.signOut().then(function () { location.reload(); });
        }

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            auth.onAuthStateChanged(function (user) {
                if (user) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                    document.getElementById('refreshBtn').hidden = false;
                    document.getElementById('logoutBtn').hidden = false;
                    generateReport();
                } else {
                    document.getElementById('dashboard-section').style.display = 'none';
                    document.getElementById('login-section').style.display = 'block';
                    document.getElementById('login-checking').style.display = 'none';
                    document.getElementById('manual-login').style.display = 'flex';
                    document.getElementById('refreshBtn').hidden = true;
                    document.getElementById('logoutBtn').hidden = true;
                    document.getElementById('dash-status').textContent = 'Build ' + DASH_BUILD;
                }
            });
        } catch (e) { console.error('Firebase Error', e); }
    </script>
</body>
</html>
